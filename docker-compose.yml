services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: voxelq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: voxelq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  inference-api:
    build:
      context: ./inference
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:voxelq@postgres:5432/voxelq
      REDIS_URL: redis://redis:6379/0
    volumes:
      # mount clips so you can add/swap videos without rebuilding the image
      - ./inference/sample_videos:/app/sample_videos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # must be reachable from your BROWSER, not the docker network
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - inference-api

volumes:
  postgres_data: